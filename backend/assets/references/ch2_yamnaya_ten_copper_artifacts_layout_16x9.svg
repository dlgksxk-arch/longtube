    <path d="M640 485 C505 390 465 620 640 630 C795 640 810 445 680 435 C580 428 550 550 645 570"/>
    <path d="M1045 485 C910 390 870 620 1045 630 C1200 640 1215 445 1085 435 C985 428 955 550 1050 570"/>
