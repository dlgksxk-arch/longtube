  <ellipse cx="165" cy="550" rx="82" ry="58" fill="#777064" stroke="#4b3428" stroke-width="11"/>
  <ellipse cx="355" cy="550" rx="82" ry="58" fill="#777064" stroke="#4b3428" stroke-width="11"/>

