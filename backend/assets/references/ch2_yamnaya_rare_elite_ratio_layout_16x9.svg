<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#b89060"/>
  <!-- Exactly three large ochre grave-cover disks. -->
  <circle cx="250" cy="240" r="105" fill="#b56d35" stroke="#4b3428" stroke-width="14"/>
  <circle cx="440" cy="240" r="105" fill="#b56d35" stroke="#4b3428" stroke-width="14"/>
  <circle cx="345" cy="440" r="105" fill="#b56d35" stroke="#4b3428" stroke-width="14"/>
  <!-- Exactly twelve smaller plain grey household pebbles in a 3-by-4 grid. -->
  <g fill="#77756f" stroke="#3d3733" stroke-width="10">
    <circle cx="770" cy="190" r="42"/><circle cx="900" cy="190" r="42"/><circle cx="1030" cy="190" r="42"/>
    <circle cx="770" cy="310" r="42"/><circle cx="900" cy="310" r="42"/><circle cx="1030" cy="310" r="42"/>
    <circle cx="770" cy="430" r="42"/><circle cx="900" cy="430" r="42"/><circle cx="1030" cy="430" r="42"/>
    <circle cx="770" cy="550" r="42"/><circle cx="900" cy="550" r="42"/><circle cx="1030" cy="550" r="42"/>
  </g>
</svg>
