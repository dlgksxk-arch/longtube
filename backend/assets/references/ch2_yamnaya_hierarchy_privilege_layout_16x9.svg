<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#a9845f"/>
  <!-- One richly furnished grave concentrates ochre and copper goods. -->
  <rect x="70" y="82" width="560" height="556" rx="18" fill="#5a4031" stroke="#342821" stroke-width="18"/>
  <rect x="232" y="170" width="226" height="330" rx="105" fill="#c3833f" stroke="#493226" stroke-width="15"/>
  <path d="M125 175 L175 150 L215 240 L150 268 Z" fill="#b9643d" stroke="#493226" stroke-width="13"/>
  <path d="M500 185 L565 185 L585 250 L480 250 Z" fill="#bd7044" stroke="#493226" stroke-width="13"/>
  <g fill="none" stroke="#d49a58" stroke-width="16">
    <circle cx="185" cy="525" r="34"/><circle cx="345" cy="560" r="34"/><circle cx="510" cy="525" r="34"/>
  </g>
  <!-- Exactly four plain graves with no goods. -->
  <g fill="#766b61" stroke="#443a33" stroke-width="15">
    <rect x="720" y="105" width="190" height="220" rx="16"/>
    <rect x="1000" y="105" width="190" height="220" rx="16"/>
    <rect x="720" y="395" width="190" height="220" rx="16"/>
    <rect x="1000" y="395" width="190" height="220" rx="16"/>
  </g>
  <g fill="#9b9184">
    <rect x="760" y="150" width="110" height="130" rx="54"/>
    <rect x="1040" y="150" width="110" height="130" rx="54"/>
    <rect x="760" y="440" width="110" height="130" rx="54"/>
    <rect x="1040" y="440" width="110" height="130" rx="54"/>
  </g>
</svg>
